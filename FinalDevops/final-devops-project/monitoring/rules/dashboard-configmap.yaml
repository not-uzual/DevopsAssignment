apiVersion: v1
data:
  notes-api.json: |-
    {
     "uid": "notes-api",
     "title": "notes-api",
     "schemaVersion": 39,
     "version": 1,
     "refresh": "10s",
     "time": {
      "from": "now-30m",
      "to": "now"
     },
     "panels": [
      {
       "id": 1,
       "title": "Request rate by status",
       "type": "timeseries",
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 12,
        "h": 7
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "expr": "sum(rate(http_request_duration_seconds_count{namespace=\"devops-final\"}[1m])) by (status)",
         "refId": "A"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "reqps"
        },
        "overrides": []
       }
      },
      {
       "id": 2,
       "title": "p95 latency",
       "type": "timeseries",
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 12,
        "h": 7
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"devops-final\"}[1m])) by (le))",
         "refId": "A"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "s"
        },
        "overrides": []
       }
      },
      {
       "id": 3,
       "title": "CPU per pod",
       "type": "timeseries",
       "gridPos": {
        "x": 0,
        "y": 7,
        "w": 8,
        "h": 7
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"devops-final\",container=\"notes-api\"}[1m])) by (pod)",
         "refId": "A"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       }
      },
      {
       "id": 4,
       "title": "Memory per pod",
       "type": "timeseries",
       "gridPos": {
        "x": 8,
        "y": 7,
        "w": 8,
        "h": 7
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "expr": "sum(container_memory_working_set_bytes{namespace=\"devops-final\",container=\"notes-api\"}) by (pod)",
         "refId": "A"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "bytes"
        },
        "overrides": []
       }
      },
      {
       "id": 5,
       "title": "Replicas (HPA)",
       "type": "timeseries",
       "gridPos": {
        "x": 16,
        "y": 7,
        "w": 8,
        "h": 7
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"devops-final\"}",
         "refId": "A"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       }
      },
      {
       "id": 6,
       "title": "Notes stored",
       "type": "stat",
       "gridPos": {
        "x": 0,
        "y": 14,
        "w": 8,
        "h": 5
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "expr": "max(notes_total{namespace=\"devops-final\"})",
         "refId": "A"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       }
      },
      {
       "id": 7,
       "title": "Pod restarts",
       "type": "timeseries",
       "gridPos": {
        "x": 8,
        "y": 14,
        "w": 16,
        "h": 5
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "targets": [
        {
         "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"devops-final\"}) by (pod)",
         "refId": "A"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       }
      },
      {
       "id": 8,
       "title": "Logs",
       "type": "logs",
       "gridPos": {
        "x": 0,
        "y": 19,
        "w": 24,
        "h": 10
       },
       "datasource": {
        "type": "loki",
        "uid": "loki"
       },
       "targets": [
        {
         "expr": "{namespace=\"devops-final\"}",
         "refId": "A"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       }
      }
     ]
    }
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: notes-api-dashboard
  namespace: monitoring
