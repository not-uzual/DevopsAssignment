rules:
  - id: no-eval
    languages: [javascript]
    severity: ERROR
    message: Avoid eval(); it enables code injection.
    pattern: eval(...)
  - id: no-child-process-exec-with-input
    languages: [javascript]
    severity: ERROR
    message: child_process.exec with dynamic input risks command injection.
    pattern: $CP.exec($X + ...)
  - id: no-hardcoded-api-key
    languages: [javascript]
    severity: ERROR
    message: Do not hardcode API keys; read them from the environment (Kubernetes Secret).
    pattern: const apiKey = "..."
