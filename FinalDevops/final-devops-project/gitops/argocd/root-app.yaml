# "App of apps": apply this ONE manifest by hand; Argo CD then creates every app in gitops/argocd/apps/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: final-devops
  source:
    repoURL: https://github.com/YOUR_USER/final-devops-project.git # <-- change me
    targetRevision: main
    path: gitops/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
