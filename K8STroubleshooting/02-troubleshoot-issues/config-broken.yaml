apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
data:
  DB_URL: postgres://db:5432/app
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-settings
              key: DB_HOST
