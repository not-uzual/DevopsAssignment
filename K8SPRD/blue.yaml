apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue
spec:
  replicas: 3

  selector:
    matchLabels:
      app: myapp
      version: blue

  template:
    metadata:
      labels:
        app: myapp
        version: blue

    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80