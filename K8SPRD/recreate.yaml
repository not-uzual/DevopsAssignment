apiVersion: apps/v1
kind: Deployment
metadata:
  name: recreate-demo

spec:
  replicas: 4

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: recreate-demo

  template:
    metadata:
      labels:
        app: recreate-demo
        version: v1

    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80